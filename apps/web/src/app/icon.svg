<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <!-- PLACEHOLDER FOR THE MARK. Rota Monster has no logo yet; until it does,
       the favicon is one piece of Soft Clay: a lavender tile with a single
       grape dot pressed into it. Swap this whole file when the mark lands.

       Raw hex is unavoidable here: an icon is fetched by the browser before any
       CSS exists, so it cannot read a token. (Token names are written without
       their leading dashes below: a double hyphen is illegal inside an XML
       comment.) The tile tracks lavender-300 and the dot tracks grape-500 in
       globals.css. The two thin arcs are the clay recipe drawn by hand: white
       across the top where the light lands, plum across the bottom where the
       clay squashes. -->
  <rect width="32" height="32" rx="9" fill="#E9E3FF"/>
  <circle cx="16" cy="16" r="6" fill="#6334CB"/>
  <path d="M11.2 13.2a6 6 0 0 1 9.6 0" fill="none" stroke="#FFFFFF"
        stroke-opacity="0.45" stroke-width="1.4" stroke-linecap="round"/>
  <path d="M11.4 19.4a6 6 0 0 0 9.2 0" fill="none" stroke="#34244D"
        stroke-opacity="0.35" stroke-width="1.4" stroke-linecap="round"/>
</svg>
