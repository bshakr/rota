# Cron-style jobs, run by the Solid Queue scheduler that `bin/jobs` starts.
#
# This is where the rota engine's periodic work lives. The hourly reminder sweep joins it here.
#
# Schedules use Fugit's natural language ("every hour at minute 12", "at 5am every day")
# and are evaluated in config.time_zone, which is UTC.

default: &default
  # Keeps every active rota's shifts materialised out to 90 days. The hour does not matter much:
  # the job is idempotent, and a missed run simply means the window is a day shorter until the
  # next one — nothing is lost, because it recomputes the whole series rather than continuing
  # from wherever it left off. 3am UTC is quiet everywhere and well clear of any group's send_hour.
  top_up_shift_windows:
    class: TopUpShiftWindowsJob
    queue: default
    schedule: every day at 3am

  # THE most important job in the system, and a reconciliation loop rather than a trigger. It does
  # not fire AT a group's send_hour — it runs every hour and asks "what reminders should have gone
  # out by now, and haven't?", so a worker that was down, a deploy on the hour, and a spring-forward
  # that skipped the hour all become a late text rather than a lost one. Idempotent: a claimed
  # reminder is skipped, so a doubled or missed run costs nothing. See ReminderSweep.
  reminder_sweep:
    class: ReminderSweepJob
    queue: default
    schedule: every hour

  # Refreshes every connected house calendar (BLO-1667). Google caches the private iCal feed for an
  # hour or two, so anything more frequent buys nothing; minute 27 keeps it clear of the reminder
  # sweep on the hour and the Solid Queue cleanup at minute 12. A no-op until an admin connects one.
  sync_house_calendars:
    class: SyncHouseCalendarsJob
    queue: default
    schedule: every hour at minute 27

  # Asks Twilio what it charged for the last week of texts, and records it on the rows that spent
  # the money (BLO-1672). Twilio settles a price minutes after delivery and never volunteers it, so
  # it has to be fetched; nightly is soon enough, because the seven-day window means a missed night
  # costs nothing. 4:40am UTC keeps it clear of the reminder sweep on the hour, the window top-up at
  # 3am, the calendar sync at minute 27 and the queue cleanup at minute 12. It reads Twilio: nothing
  # on this path can send a text.
  backfill_sms_prices:
    class: BackfillSmsPricesJob
    queue: default
    schedule: every day at 4:40am

  clear_solid_queue_finished_jobs:
    command: "SolidQueue::Job.clear_finished_in_batches(sleep_between_batches: 0.3)"
    schedule: every hour at minute 12

  # The same housekeeping, for the table that exists BECAUSE of the line above (BLO-1677). The three
  # jobs here each write a job_runs row every pass — about fifty rows a day — and ninety days of
  # them is a few thousand: enough to answer "when did this start failing?" across a quarter, and
  # small enough that the table never needs thinking about again. Shaped as a one-line command like
  # its neighbour, because the whole job is the one line. 2:20am is clear of the sweep on the hour,
  # the window top-up at 3am, the price backfill at 4:40am, the calendar sync at minute 27 and the
  # queue cleanup at minute 12.
  prune_job_runs:
    command: "JobRun.prune!"
    schedule: every day at 2:20am

development:
  <<: *default

test:
  <<: *default

production:
  <<: *default
