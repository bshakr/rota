# Install as /etc/newsyslog.d/rota.conf (root:wheel 0644). Only the logs launchd
# reopens on every run: api, web and postgres hold theirs open, so deploy.sh
# trims those in place instead of letting newsyslog rename them.
# logfilename               [owner:group]  mode  count  size(KB)  when  flags
/opt/rota/log/deploy.log    rota:rota      640   7      1024      *     NZ
/opt/rota/log/backup.log    rota:rota      640   7      256       *     NZ
